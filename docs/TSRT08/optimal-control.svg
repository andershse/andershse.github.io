<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
  <title id="title">Optimal control trajectory</title>
  <desc id="desc">A control path curves through a state space toward a target while a controller adjusts the system.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233f"/>
      <stop offset="1" stop-color="#1b5472"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6fe4d5"/>
      <stop offset="1" stop-color="#ffd47a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="720" rx="28" fill="url(#background)"/>
  <g fill="none" stroke="#b8d9e5" stroke-opacity=".2" stroke-width="2">
    <path d="M80 150H560M80 250H560M80 350H560M80 450H560M80 550H560"/>
    <path d="M160 90V610M260 90V610M360 90V610M460 90V610M560 90V610"/>
  </g>
  <g fill="none" stroke="#c7e3ed" stroke-width="3" stroke-linecap="round">
    <path d="M88 590V112M88 590H570"/>
    <path d="m78 125 10-16 10 16M557 580l16 10-16 10"/>
  </g>
  <g fill="#e3f4f7" font-family="Arial, sans-serif" font-size="19">
    <text x="50" y="105">State</text>
    <text x="510" y="630">Time</text>
    <text x="120" y="72" font-size="24" font-weight="700">OPTIMAL TRAJECTORY</text>
  </g>
  <path d="M105 520C165 505 167 416 237 425S325 487 365 364 424 231 480 264 509 192 545 149"
        fill="none" stroke="url(#path)" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M105 520C165 505 167 416 237 425S325 487 365 364 424 231 480 264 509 192 545 149"
        fill="none" stroke="#d8fff4" stroke-opacity=".85" stroke-width="2" stroke-dasharray="3 14" stroke-linecap="round"/>
  <g fill="#ffe19a" stroke="#fff4cf" stroke-width="5">
    <circle cx="105" cy="520" r="12"/>
    <circle cx="545" cy="149" r="13"/>
  </g>
  <circle cx="545" cy="149" r="30" fill="none" stroke="#ffe19a" stroke-opacity=".55" stroke-width="2"/>
  <g transform="translate(355 540)">
    <rect width="188" height="64" rx="12" fill="#10233f" fill-opacity=".8" stroke="#b8d9e5" stroke-opacity=".55"/>
    <text x="94" y="25" text-anchor="middle" fill="#c7e3ed" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">CONTROL INPUT</text>
    <path d="M25 47h31l11-17 16 25 14-18 13 10h54" fill="none" stroke="#6fe4d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
